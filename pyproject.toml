[project]
name = "gis-queue-feed"
version = "0.1.0"
description = "Tracks month-over-month changes in ERCOT's generator interconnection queue"
readme = "README.md"
authors = [
    { name = "Mike Michelini", email = "micmich@umich.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "openpyxl>=3.1.5",
    "pandas>=3.1.1",
    "psycopg[binary]>=3.3.9",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
